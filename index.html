<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octane Launcher</title>
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/poppins-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("/fonts/poppins-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("/fonts/poppins-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/poppins-700.woff2") format("woff2");
      }

      :root {
        --splash-bg: #181a1f;
        --splash-text: #e8e8e8;
        --splash-accent: #4572e3;
      }

      :root.theme-light {
        --splash-bg: #ffffff;
        --splash-text: #1a1a2e;
        --splash-accent: #4361ee;
      }

      :root.theme-rose {
        --splash-bg: #251f2b;
        --splash-text: #e8e8ee;
        --splash-accent: #f472b6;
      }

      :root.theme-forest {
        --splash-bg: #1f2b24;
        --splash-text: #e8eee9;
        --splash-accent: #4ade80;
      }

      body {
        background-color: var(--splash-bg);
        margin: 0;
        padding: 0;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        background: var(--splash-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }

      #splash-screen.hidden {
        animation: fadeOut 0.5s ease-out forwards;
      }

      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes logoIn {
        from {
          opacity: 0;
          transform: scale(0.82);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loaderSlide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      .splash-container {
        text-align: center;
        position: relative;
      }

      .splash-container img {
        width: 120px;
        height: 120px;
        display: block;
        margin: 0 auto 18px;
        animation: logoIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .splash-container h1 {
        color: var(--splash-text);
        font-size: 28px;
        line-height: 36px;
        font-weight: 600;
        margin: 0;
        animation: riseIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
      }

      .splash-loader {
        width: 220px;
        height: 3px;
        margin: 22px auto 0;
        border-radius: 999px;
        background: color-mix(in srgb, var(--splash-accent) 18%, transparent);
        overflow: hidden;
        position: relative;
        animation: riseIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .splash-loader::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--splash-accent);
        animation: loaderSlide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .splash-status {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        color: var(--splash-text);
        opacity: 0.7;
        font-size: 14px;
        line-height: 20px;
        margin: 10px 0 0;
        animation: riseIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }

      .splash-status:empty {
        display: none;
      }

      .splash-progress {
        display: none;
        width: 220px;
        height: 3px;
        margin: 22px auto 0;
        border-radius: 999px;
        background: color-mix(in srgb, var(--splash-accent) 18%, transparent);
        overflow: hidden;
      }

      .splash-progress.active {
        display: block;
      }

      .splash-progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
        transition: width 0.2s ease-out;
      }

      #root {
        position: relative;
        opacity: 0;
        transition: opacity 0.3s ease-out 0.2s;
      }

      #root.visible {
        opacity: 1;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('octane_theme') || 'octane'
        if (theme !== 'octane') {
          document.documentElement.classList.add('theme-' + theme)
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="splash-screen">
      <div class="splash-container">
        <img src="/logo.png" alt="Octane Launcher" />
        <h1>Octane Launcher</h1>
        <div class="splash-loader"></div>
        <div class="splash-progress" id="splash-progress">
          <div class="splash-progress-fill" id="splash-progress-fill"></div>
        </div>
        <div class="splash-status" id="splash-status"></div>
      </div>
    </div>
    <div id="root"></div>

    <script type="module" src="/frontend/main.ts"></script>
  </body>
</html>
