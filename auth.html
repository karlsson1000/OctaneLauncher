<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octane Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            background: #1a1c21;
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 28px 10vh;
        }

        main {
            width: 100%;
            max-width: 720px;
            text-align: center;
            white-space: nowrap;
        }

        .mark {
            display: block;
            width: clamp(56px, 14vw, 76px);
            height: clamp(56px, 14vw, 76px);
            margin: 0 auto 28px;
            overflow: visible;
            transform-origin: 50% 70%;
            animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s both;
        }

        .tick {
            fill: none;
            stroke: #4572e3;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 26;
            stroke-dashoffset: 26;
            animation: draw 0.5s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
        }

        h1 {
            font-size: clamp(23px, 5.6vw, 28px);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        p {
            color: #7d8590;
        }

        .reveal {
            opacity: 0;
            filter: blur(2px);
            animation: reveal 0.5s ease-out forwards;
        }

        h1.reveal { animation-delay: 0.6s; }
        p.reveal  { animation-delay: 0.65s; }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        @keyframes pop {
            55% { transform: scale(1.05); }
        }

        @keyframes reveal {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }
    </style>
</head>
<body>
    <main>
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <path class="tick" d="M4 12.5 L9.5 18 L20 6"/>
        </svg>
        <h1 class="reveal">You’re signed in!</h1>
        <p class="reveal">You can close this tab and head back to Octane Launcher.</p>
    </main>
</body>
</html>
